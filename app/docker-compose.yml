services:
  matchmaker-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: matchmaker-server
    restart: always
    env_file:
      - .env
    container_name: matchmaker-server
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./models:/app/models:ro
      - ./antismash_databases:/app/antismash_databases
      - ./mibig_nrps_db:/app/mibig_nrps_db
      - ./mibig_nrps_db_out:/app/mibig_nrps_db_out
    environment:
      - MODEL_DIR=/app/models
      - ANTISMASH_DB_DIR=/app/antismash_databases
      - MIBIG_SQL_DB=/app/mibig_nrps_db_out/mibig_nrps.db
      - LOG_LEVEL=DEBUG
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - JOBLIB_MMAP_MODE=r
    networks: [ matchmaker-network ]
    healthcheck:
      # Use base Python; no curl/wget dependency needed
      test: [ "CMD", "/opt/conda/bin/python", "-c",
              "import urllib.request,sys; urllib.request.urlopen('http://localhost:4009/health', timeout=2); sys.exit(0)" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  matchmaker-client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        - REACT_APP_TURNSTILE_SITE_KEY=${REACT_APP_TURNSTILE_SITE_KEY}
    image: matchmaker-client
    ports:
      - "4010:80"
    restart: always
    container_name: matchmaker-client
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks: [ matchmaker-network ]
    depends_on:
      - matchmaker-server

networks:
  matchmaker-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450
